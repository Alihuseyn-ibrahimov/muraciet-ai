# Alembic migrasiyaları (yeni sistem, muraciet_v2).
# URL bura yazılmır: kod MIGRATION_DATABASE_URL-i oxuyur. Adi istifadə:
#   python -m app.manage migrate
# Yeni migrasiya yaratmaq üçün:
#   alembic revision --autogenerate -m "təsvir"
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
